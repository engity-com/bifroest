startMessage: >
  Welcome to Engity's Bifröst!
  This instance runs a default configuration.
  See https://bifroest.engity.org/setup/ for more details.

flows:
  - name: local
    authorization:
      type: local
      rememberMe: allowedAndEnabledByDefault
      pamService: "sshd"

    environment:
      type: local
      name: "{{.authorization.user.name}}"
