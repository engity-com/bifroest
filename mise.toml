[tools]
"pipx:reuse" = { version = "6.2.0", extras = "chardet", uvx_args = "--python 3.14" }

[tasks."install"]
run = [
    { task = "install:go" },
    { task = "install:web" },
    { task = "install:docs" }
]

[tasks."install:go"]
run = "go mod download"

[tasks."install:web"]
dir = "web"
run = "bun install --frozen-lockfile --ignore-scripts"

[tasks."install:web:browser"]
dir = "web"
run = "bun run test:browser:install"

[tasks."install:docs"]
run = "python -m pip install -r docs/requirements.txt"

[tasks."lint"]
run = [
    { task = "lint:biome" },
    { task = "lint:go" },
    { task = "lint:web" },
    { task = "lint:reuse" }
]

[tasks."format"]
run = "biome format --write ."

[tasks."lint:biome"]
run = "biome check --error-on-warnings ."

[tasks."lint:go"]
run = "golangci-lint run --color=always"

[tasks."lint:reuse"]
run = "reuse lint --lines"

[tasks."lint:web"]
dir = "web"
run = "bun run check"

[tasks."test"]
run = [
    { task = "test:go" },
    { task = "test:web" }
]

[tasks."test:go"]
depends = ["build:var"]
run = [
    'go test -v -covermode atomic -coverprofile=var/profile.cov ./...',
    'go test -v -tags=local_build,local_kind ./pkg/alternatives'
]

[tasks."test:go:race"]
depends = ["build:var"]
run = "go test -race ./..."

[tasks."test:web"]
dir = "web"
run = "bun run test"

[tasks."test:e2e:local"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHLocal(Backend|SessionRecording|EncryptedSessionRecordingPTY)$' ./test/e2e"

[tasks."test:e2e:docker"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHDockerEnvironment(SessionRecording)?$' ./test/e2e"

[tasks."test:e2e:ssh"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHSSHEnvironment(SessionRecording|Subsystem|ReverseForwarding)$' ./test/e2e"

[tasks."test:e2e:kubernetes"]
depends = ["build:var"]
run = "go test -v -count=1 -failfast -tags=e2e -timeout=30m -run '^TestOpenSSHKubernetesEnvironment(SessionRecording)?$' ./test/e2e"

[tasks."test:e2e:authorization"]
depends = ["build:var", "build:e2e:authorization"]
run = "go test -v -count=1 -tags=e2e -timeout=5m -run '^Test(HtpasswdAuthorization|OIDC.*|SimpleRememberMe)$' ./test/e2e"

[tasks."build:e2e:authorization"]
description = "Warm fixture compilation before the unchanged authorization test deadline."
depends = ["build:var"]
env = { CGO_ENABLED = "0" }
# Warm outputs are not fixture inputs. Each test still builds its own binaries,
# private keys and unique version from this checkout; no shared executable replay.
run = [
    "mkdir -p var/e2e/authorization-build-cache",
    "go build -tags local_build,local_kind -trimpath -ldflags='-s -w' -o var/e2e/authorization-build-cache/bifroest ./cmd/bifroest",
    "go build -tags e2e -trimpath -ldflags='-s -w' -o var/e2e/authorization-build-cache/helper ./test/e2e/helper"
]

[tasks."test:e2e:pam"]
depends = ["install:go", "build:web"]
run = "node test/pam/run.mjs"

[tasks."test:e2e:nanoserver"]
run = "go test -v -count=1 -tags=nanoserver_integration -timeout=20m -run=TestPinnedNanoServerLocalEnvironment ./test/nanoserver"

[tasks."test:e2e:darwin"]
depends = ["build:var"]
env = {
    CGO_ENABLED = "0"
}
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^Test(OpenSSHLocalNative|DarwinLocalAccountLifecycle|DarwinLaunchDaemon)$' ./test/e2e"

[tasks."test:e2e"]
run = [
    { task = "test:e2e:authorization" },
    { task = "test:e2e:local" },
    { task = "test:e2e:docker" },
    { task = "test:e2e:ssh" },
    { task = "test:e2e:kubernetes" }
]

[tasks."build"]
run = [
    { task = "build:go" },
    { task = "build:docs" }
]

[tasks."build:go"]
depends = ["build:web"]
run = "go run ./cmd/build build --log.colorMode=always"

[tasks."build:go:binary"]
run = "go run ./cmd/build build-binary --log.colorMode=always"

[tasks."build:go:package"]
run = "go run ./cmd/build package-binaries --log.colorMode=always"

[tasks."build:web"]
dir = "web"
run = "bun run build"

[tasks."build:docs"]
run = [
    "python -m unittest discover -s test -p 'test_docs_*.py'",
    "mkdocs --color build -c",
    "rm -f var/doc/requirements.txt"
]
run_windows = [
    'python -m unittest discover -s test -p "test_docs_*.py"',
    'mkdocs --color build -c',
    '''del var\doc\requirements.txt'''
]

[tasks."serve:docs"]
run = [
    "mkdocs --color serve -c",
    "rm -f var/doc/requirements.txt"
]
run_windows = [
    'mkdocs --color serve -c',
    '''del var\doc\requirements.txt'''
]

[tasks."build:var"]
hide = true
run = "mkdir -p var"
run_windows = 'if not exist var mkdir var'

[tasks."ci:evaluate-environment"]
hide = true
run = "go run ./cmd/build evaluate-environment --log.colorMode=always"

[tasks."ci:write-build-epoch"]
hide = true
run = "go run ./cmd/build write-build-epoch"

[tasks."ci:inspect-pr-action"]
hide = true
run = "go run ./cmd/build inspect-pr-action --log.colorMode=always"

[tasks."tools:kind:up"]
run = "kind create cluster --name bifroest --wait 5m"

[tasks."tools:kind:down"]
run = "kind delete cluster --name bifroest"

[settings]
env_file = ".env"

[tool_alias]
biome = "aqua:biomejs/biome"
golangci-lint = "aqua:golangci/golangci-lint"
go-licenses = "go:github.com/google/go-licenses/v2"
syft = "aqua:anchore/syft"

[env]
_.python.venv = { path = ".pyvenv", create = true, uv_create_args = ['--seed'] }
