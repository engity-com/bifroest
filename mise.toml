[tools]
"pipx:reuse" = { version = "6.2.0", extras = "chardet", uvx_args = "--python 3.14" }

[tasks."bifroest"]
depends = ["build:web"]
raw = true
raw_args = true
run = "go run ./cmd/bifroest"

[tasks."install"]
run = [
    { task = "install:go" },
    { task = "install:web" },
    { task = "install:docs" }
]

[tasks."install:go"]
run = "go mod download"

[tasks."install:web"]
dir = "web"
run = "bun install --frozen-lockfile --ignore-scripts"

[tasks."install:web:browser"]
dir = "web"
run = "bun run test:browser:install"

[tasks."install:docs"]
run = "python -m pip install -r docs/requirements.txt"

[tasks."lint"]
run = [
    { task = "lint:biome" },
    { task = "lint:go" },
    { task = "lint:lua" },
    { task = "lint:web" },
    { task = "lint:reuse" }
]

[tasks."format"]
run = [
    "biome format --write .",
    { task = "format:lua" }
]

[tasks."lint:lua"]
description = "Check repository Lua sources with Luacheck 1.2.0 and pinned StyLua; not a Bifröst command."
run = [
    "luacheck --config .luacheckrc --no-default-config pkg/test",
    "stylua --config-path .stylua.toml --check pkg/test"
]

[tasks."format:lua"]
description = "Format repository Lua sources, verifying the parsed output."
run = "stylua --config-path .stylua.toml --verify pkg/test"

[tasks."lint:biome"]
run = "biome check --error-on-warnings ."

[tasks."lint:go"]
run = "golangci-lint run --color=always"

[tasks."lint:reuse"]
run = "reuse lint --lines"

[tasks."lint:web"]
dir = "web"
run = "bun run check"

[tasks."test"]
run = [
    { task = "test:go" },
    { task = "test:web" }
]

[tasks."test:go"]
depends = ["build:var"]
# GO_TEST_PARALLELISM=1 restores serial compilation/testing on smaller runners.
run = [
    'gotestsum --format standard-verbose --jsonfile var/test-report/core.jsonl --junitfile var/test-report/core.xml -- -p={{env.GO_TEST_PARALLELISM | default(value="2")}} ./...',
    'gotestsum --format standard-verbose --jsonfile var/test-report/alternatives.jsonl --junitfile var/test-report/alternatives.xml -- -p={{env.GO_TEST_PARALLELISM | default(value="2")}} -tags=local_build,local_kind ./pkg/alternatives'
]

[tasks."test:go:coverage"]
description = "Collect coverage once on native Linux; other test configurations remain uninstrumented."
depends = ["build:var"]
run = [
    'gotestsum --format standard-verbose --jsonfile var/test-report/core.jsonl --junitfile var/test-report/core.xml -- -p={{env.GO_TEST_PARALLELISM | default(value="2")}} -covermode atomic -coverprofile=var/profile.cov ./...',
    'gotestsum --format standard-verbose --jsonfile var/test-report/alternatives.jsonl --junitfile var/test-report/alternatives.xml -- -p={{env.GO_TEST_PARALLELISM | default(value="2")}} -tags=local_build,local_kind ./pkg/alternatives'
]

[tasks."test:go:race"]
depends = ["build:var"]
run = 'gotestsum --format standard-verbose --jsonfile var/test-report/race.jsonl --junitfile var/test-report/race.xml -- -p={{env.GO_TEST_PARALLELISM | default(value="2")}} -race ./...'

[tasks."test:policy"]
description = "Build and check the native offline policy CLI; var/policy-ci must not exist."
run = "go run ./test/policyci --output var/policy-ci"

[tasks."test:policy:oci"]
description = "Check native/OCI parity with a hardened regular Generic Linux image; var/policy-oci must be new."
run = "go run ./test/policyci --oci --runtime docker --output var/policy-oci"

[tasks."test:go:browser"]
description = "Run built HTTPS browser integration separately from the core package deadline."
depends = ["build:var"]
dir = "web"
env = { BIFROEST_TEST_BROWSER_UI = "1", BIFROEST_TEST_BROWSER_CLIENT = "1" }
run = "node scripts/browser-go-tests.ts"

[tasks."test:web"]
dir = "web"
run = "bun run test"

[tasks."test:e2e:local"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHLocal(Backend|SessionRecording|EncryptedSessionRecordingPTY)$' ./test/e2e"

[tasks."test:e2e:docker"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHDockerEnvironment(SessionRecording)?$' ./test/e2e"

[tasks."test:e2e:ssh"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHSSHEnvironment(SessionRecording|Subsystem|ReverseForwarding)$' ./test/e2e"

[tasks."test:e2e:curl"]
description = "Probe installed curl HTTP and WebSocket binary streaming capabilities."
run = "go test -v -count=1 -tags=e2e -timeout=2m ./test/curl"

[tasks."test:e2e:tunnel"]
description = "Test the built SSH-over-HTTPS/WSS server with native OpenSSH, curl and SFTP."
depends = ["build:web", "build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=10m -run '^TestOpenSSHTunnel$' ./test/e2e"

[tasks."test:e2e:kubernetes"]
depends = ["build:var"]
run = "go test -v -count=1 -failfast -tags=e2e -timeout=30m -run '^TestOpenSSHKubernetesEnvironment(SessionRecording)?$' ./test/e2e"

[tasks."test:e2e:authorization"]
depends = ["build:var", "build:e2e:authorization"]
run = "go test -v -count=1 -tags=e2e -timeout=5m -run '^Test(HtpasswdAuthorization|OIDC.*|SimpleRememberMe)$' ./test/e2e"

[tasks."build:e2e:authorization"]
description = "Warm fixture compilation before the unchanged authorization test deadline."
depends = ["build:var"]
env = { CGO_ENABLED = "0" }
# Warm outputs are not fixture inputs. Each test still builds its own binaries,
# private keys and unique version from this checkout; no shared executable replay.
run = [
    "mkdir -p var/e2e/authorization-build-cache",
    "go build -tags local_build,local_kind -trimpath -ldflags='-s -w' -o var/e2e/authorization-build-cache/bifroest ./cmd/bifroest",
    "go build -tags e2e -trimpath -ldflags='-s -w' -o var/e2e/authorization-build-cache/helper ./test/e2e/helper"
]

[tasks."test:e2e:pam"]
depends = ["install:go", "build:web"]
run = "node test/pam/run.ts"

[tasks."test:e2e:nanoserver"]
run = "go test -v -count=1 -tags=nanoserver_integration -timeout=20m -run=TestPinnedNanoServerLocalEnvironment ./test/nanoserver"

[tasks."test:e2e:darwin"]
depends = ["build:var"]
env = {
    CGO_ENABLED = "0"
}
# Create the shared log directory as the runner before tests re-execute via sudo.
run = [
    "mkdir -p var/e2e",
    "go test -v -count=1 -tags=e2e -timeout=30m -run '^Test(OpenSSHLocalNative|DarwinLocalAccountLifecycle|DarwinLaunchDaemon)$' ./test/e2e"
]

[tasks."test:e2e"]
run = [
    { task = "test:e2e:curl" },
    { task = "test:e2e:tunnel" },
    { task = "test:e2e:authorization" },
    { task = "test:e2e:local" },
    { task = "test:e2e:docker" },
    { task = "test:e2e:ssh" },
    { task = "test:e2e:kubernetes" }
]

[tasks."build"]
run = [
    { task = "build:go" },
    { task = "build:docs" }
]

[tasks."build:go"]
depends = ["build:web"]
run = "go run ./cmd/build build --log.colorMode=always"

[tasks."build:go:binary"]
run = "go run ./cmd/build build-binary --log.colorMode=always"

[tasks."build:go:package"]
run = "go run ./cmd/build package-binaries --log.colorMode=always"

[tasks."release:preview"]
description = "Preview release artifacts locally: <version> [--snapshot <directory>] [--body-file <file>]. Never edits GitHub."
raw = true
raw_args = true
run = "go run ./cmd/build release-description preview"

[tasks."release:update"]
description = "Update a published release description: <version>. Requires a write-capable GitHub token."
raw = true
raw_args = true
run = "go run ./cmd/build release-description update"

[tasks."build:web"]
dir = "web"
run = "bun run build"
sources = [
    "**/*",
    "!node_modules"
]
outputs = [
    "../pkg/webui/assets/**/*"
]

[tasks."build:docs"]
run = [
    "python -m unittest discover -s test -p 'test_docs_*.py'",
    "mkdocs --color build -c",
    "rm -f var/doc/requirements.txt"
]
run_windows = [
    'python -m unittest discover -s test -p "test_docs_*.py"',
    'mkdocs --color build -c',
    '''del var\doc\requirements.txt'''
]

[tasks."serve:docs"]
run = [
    "mkdocs --color serve -c",
    "rm -f var/doc/requirements.txt"
]
run_windows = [
    'mkdocs --color serve -c',
    '''del var\doc\requirements.txt'''
]

[tasks."build:var"]
hide = true
run = "mkdir -p var"
run_windows = 'if not exist var mkdir var'

[tasks."ci:evaluate-environment"]
hide = true
run = "go run ./cmd/build evaluate-environment --log.colorMode=always"

[tasks."ci:write-build-epoch"]
hide = true
run = "go run ./cmd/build write-build-epoch"

[tasks."ci:inspect-pr-action"]
hide = true
run = "go run ./cmd/build inspect-pr-action --log.colorMode=always"

[tasks."tools:kind:up"]
run = "kind create cluster --name bifroest --wait 5m"

[tasks."tools:kind:down"]
run = "kind delete cluster --name bifroest"

[settings]
env_file = ".env"

[tool_alias]
biome = "aqua:biomejs/biome"
golangci-lint = "aqua:golangci/golangci-lint"
gotestsum = "aqua:gotestyourself/gotestsum"
go-licenses = "go:github.com/google/go-licenses/v2"
stylua = "aqua:JohnnyMorganz/StyLua"
syft = "aqua:anchore/syft"
helm = "aqua:helm/helm"

[env]
_.python.venv = { path = ".pyvenv", create = true, uv_create_args = ['--seed'] }
