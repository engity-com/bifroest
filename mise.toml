[tasks."install"]
run = [
    { task = "install:go" },
    { task = "install:docs" }
]

[tasks."install:go"]
run = "go mod download"

[tasks."install:docs"]
run = "python -m pip install -r docs/requirements.txt"

[tasks."lint"]
run = [
    { task = "lint:go" }
]

[tasks."lint:go"]
run = "golangci-lint run --color=always"

[tasks."test"]
run = [
    { task = "test:go" }
]

[tasks."test:go"]
depends = ["build:var"]
run = [
    'go test -v -covermode atomic -coverprofile=var/profile.cov ./...',
    'go test -v -tags=local_build,local_kind ./pkg/alternatives'
]

[tasks."test:e2e:local"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHLocalBackend$' ./test/e2e"

[tasks."test:e2e:docker"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHDockerEnvironment$' ./test/e2e"

[tasks."test:e2e:kubernetes"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=30m -run '^TestOpenSSHKubernetesEnvironment$' ./test/e2e"

[tasks."test:e2e:authorization"]
depends = ["build:var"]
run = "go test -v -count=1 -tags=e2e -timeout=5m -run '^Test(HtpasswdAuthorization|OIDCDeviceAuthorization)$' ./test/e2e"

[tasks."test:e2e"]
run = [
    { task = "test:e2e:authorization" },
    { task = "test:e2e:local" },
    { task = "test:e2e:docker" },
    { task = "test:e2e:kubernetes" }
]

[tasks."build"]
run = [
    { task = "build:go" },
    { task = "build:docs" }
]

[tasks."build:go"]
run = "go run ./cmd/build build --log.colorMode=always"

[tasks."build:docs"]
run = [
    "mkdocs --color build -c",
    "rm -f var/doc/requirements.txt"
]
run_windows = [
    'mkdocs --color build -c',
    '''del var\doc\requirements.txt'''
]

[tasks."build:var"]
hide = true
run = "mkdir -p var"
run_windows = 'if not exist var mkdir var'

[tasks."ci:evaluate-environment"]
hide = true
run = "go run ./cmd/build evaluate-environment --log.colorMode=always"

[tasks."ci:inspect-pr-action"]
hide = true
run = "go run ./cmd/build inspect-pr-action --log.colorMode=always"

[tasks."tools:kind:up"]
run = "kind create cluster --name bifroest --wait 5m"

[tasks."tools:kind:down"]
run = "kind delete cluster --name bifroest"

[settings]
env_file = ".env"

[tool_alias]
golangci-lint = "aqua:golangci/golangci-lint"

[env]
_.python.venv = { path = ".pyvenv", create = true, uv_create_args = ['--seed'] }
KIND_EXPERIMENTAL_PROVIDER = "podman"
