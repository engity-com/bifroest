# This is used by the action https://github.com/dorny/paths-filter

go: &go
  - "go.mod"
  - "go.sum"
  - ".golangci.yml"
  - ".syft.yaml"
  - "REUSE.toml"
  - "LICENSE"
  - "LICENSES/**"
  - "pkg/**"
  - "web/**"
  - "docs/assets/audit-format-vectors/**"
  - "docs/assets/recording-format-vectors/**"
  - "cmd/**"
  - "internal/**"
  - "charts/**"
  - "contrib/**"
  - "test/**"
  - ".github/**"
  - "mise.toml"
  - "mise.tools.yaml"

docs: &docs
  - "mkdocs.yml"
  - "docs/**"
  - "contrib/**"
  - "**/*.md"
  - "LICENSE"
  - ".github/**"
  - "mise.toml"
  - "mise.tools.yaml"

any:
  - *go
  - *docs
