name: Build and package

on:
  workflow_call:
    inputs:
      test_host_matrix:
        required: true
        type: string
      test_container_matrix:
        required: true
        type: string
      binary_host_matrix:
        required: true
        type: string
      binary_container_matrix:
        required: true
        type: string
      ref:
        type: string
        default: ""
      commit:
        type: string
        default: ""
      lint_go:
        type: boolean
        default: false
      lint_reuse:
        type: boolean
        default: false
      upload_dist:
        type: boolean
        default: false
    secrets:
      MACOS_DEVELOPER_ID_CERTIFICATE:
        required: false
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_APP_STORE_CONNECT_KEY:
        required: false
      MACOS_APP_STORE_CONNECT_KEY_ID:
        required: false
      MACOS_APP_STORE_CONNECT_ISSUER_ID:
        required: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  BIFROEST_VENDOR: "Engity GmbH"

jobs:
  browser:
    name: Browser assets and inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      # Browser integration uses the static build, like test-host. Native PAM
      # compilation remains covered by test-container's prepared build image.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: browser
          context: cgo0

      - name: Install pinned browser toolchain
        run: mise -C web install

      - name: Install frozen dependencies without lifecycle scripts
        run: mise -C web run install:web

      - name: Check browser sources
        run: mise -C web run lint:web

      - name: Build browser before any release binary
        run: mise -C web run build:web

      - name: Check browser build inventory
        run: mise -C web exec -- bun run test:release

      - name: Install Chromium
        run: mise -C web run install:web:browser

      - name: Test browser
        run: mise -C web run test:web

      - name: Test shared Go core
        run: |
          export BIFROEST_TEST_NODE="$(mise -C web which node)"
          mise -C web run test:go

      - name: Test built HTTPS browser
        run: |
          export BIFROEST_TEST_NODE="$(mise -C web which node)"
          mise -C web run test:go:browser

      - name: Upload exact browser assets for every binary host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-assets
          path: pkg/webui/assets
          retention-days: 1
          if-no-files-found: error

  test-host:
    name: Tests ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_host_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ""
      GOFLAGS: "-p=2"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-host
          context: cgo0

      - name: Install pinned WebCrypto test runtime
        run: mise -C web install node

      - &install-go-dependencies
        name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mise run install:go; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "::warning::Go module download failed (attempt ${attempt}/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Test
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise -C web exec -- node scripts/native-go-tests.ts

  lint-go-host:
    name: Go lint ${{ matrix.os }}
    if: inputs.lint_go
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_host_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ""
      GOFLAGS: "-p=2"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: lint-go-host
          context: cgo0

      - *install-go-dependencies

      - name: Lint Go
        run: mise run lint:go

  lint-lua:
    name: Lua source lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      MISE_GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install pinned formatter
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: stylua

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Check Lua source and formatting without writing
        run: mise run lint:lua

  test-policy:
    name: Offline policy CLI ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # test_host_matrix contains only Darwin/Windows; Linux uses a separate
      # container matrix. These offline CLI checks need a native Linux job too.
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-15
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      MISE_GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE and pinned Go
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-policy
          context: cgo0

      - *install-go-dependencies

      - name: Check native offline policy CLI and reports
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
        run: mise run test:policy

      - name: Upload policy reports even after a failed check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: policy-reports-${{ matrix.os }}
          path: var/policy-ci/reports/
          if-no-files-found: warn
          retention-days: 7

  test-policy-oci:
    name: Offline policy native/OCI parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      MISE_GITHUB_TOKEN: ""
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE and pinned Go/Docker client
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: go docker-cli

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-policy-oci
          context: cgo0

      - *install-go-dependencies

      - name: Check restricted OCI execution against the native CLI
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
        run: mise run test:policy:oci

      - name: Upload parity reports even after a failed check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: policy-oci-reports-linux
          path: var/policy-oci/reports/
          if-no-files-found: warn
          retention-days: 7

  test-container:
    name: Tests ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-container
          context: native-${{ matrix.image }}

      - &configure-container-git
        name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - *install-go-dependencies

      - &install-asciinema
        name: Install asciinema compatibility tool
        env:
          MISE_GITHUB_TOKEN: ""
          ASCIINEMA_VERSION: 3.2.1
          ASCIINEMA_SHA256: bec9781bc8f297a9d3d74ff60205599507f2abba1183578b8b2f22be4c999214
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/asciinema" \
            "https://github.com/asciinema/asciinema/releases/download/v${ASCIINEMA_VERSION}/asciinema-x86_64-unknown-linux-musl"
          printf '%s  %s\n' "$ASCIINEMA_SHA256" "$RUNNER_TEMP/asciinema" | sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/asciinema"
          test "$("$RUNNER_TEMP/asciinema" --version)" = "asciinema ${ASCIINEMA_VERSION}"
          echo "ASCIINEMA=$RUNNER_TEMP/asciinema" >> "$GITHUB_ENV"

      - name: Test
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run test:go

  test-race:
    name: Race tests ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-race
          context: native-${{ matrix.image }}

      - *configure-container-git

      - *install-go-dependencies

      - *install-asciinema

      - name: Test with race detector
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run test:go:race

  lint-go-container:
    name: Go lint ${{ matrix.os }}
    if: inputs.lint_go
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: lint-go-container
          context: native-${{ matrix.image }}

      - *configure-container-git

      - *install-go-dependencies

      - name: Lint Go
        run: mise run lint:go

  binary-host:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}/${{ matrix.edition }}
    needs: browser
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.binary_host_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: binary-host
          context: ${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.edition }}

      - *install-go-dependencies

      - name: Set reproducible build time
        run: mise run ci:write-build-epoch

      - name: Download verified browser assets before Go embedding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-assets
          path: pkg/webui/assets

      - name: Build binary
        run: mise run build:go:binary -- --os=${{ matrix.os }} --arch=${{ matrix.arch }} --edition=${{ matrix.edition }}
        env:
          BIFROEST_DARWIN_CERTIFICATE: ${{ matrix.os == 'darwin' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE || '' }}
          BIFROEST_DARWIN_CERTIFICATE_PASSWORD: ${{ matrix.os == 'darwin' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
          BIFROEST_DARWIN_SIGNING_IDENTITY: ${{ matrix.os == 'darwin' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          BIFROEST_DARWIN_NOTARY_KEY: ${{ matrix.os == 'darwin' && secrets.MACOS_APP_STORE_CONNECT_KEY || '' }}
          BIFROEST_DARWIN_NOTARY_KEY_ID: ${{ matrix.os == 'darwin' && secrets.MACOS_APP_STORE_CONNECT_KEY_ID || '' }}
          BIFROEST_DARWIN_NOTARY_ISSUER_ID: ${{ matrix.os == 'darwin' && secrets.MACOS_APP_STORE_CONNECT_ISSUER_ID || '' }}

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.edition }}
          path: var/dist
          retention-days: 1
          if-no-files-found: error

  binary-container:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}/${{ matrix.edition }}
    needs: browser
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.binary_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: binary-container
          context: ${{ matrix.image }}-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.edition }}

      - *install-go-dependencies

      - name: Set reproducible build time
        run: mise run ci:write-build-epoch

      - name: Download verified browser assets before Go embedding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-assets
          path: pkg/webui/assets

      - name: Build binary
        run: mise run build:go:binary -- --os=${{ matrix.os }} --arch=${{ matrix.arch }} --edition=${{ matrix.edition }}

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.edition }}
          path: var/dist
          retention-days: 1
          if-no-files-found: error

  package:
    name: Package
    needs: [test-host, test-container, test-race, lint-go-host, lint-go-container, binary-host, binary-container]
    # Release skips Go lint by default. Do not let that skip packaging, but
    # require every mandatory check and both lint jobs whenever lint is enabled.
    if: >-
      ${{ !cancelled() &&
          needs.test-host.result == 'success' &&
          needs.test-container.result == 'success' &&
          needs.test-race.result == 'success' &&
          needs.binary-host.result == 'success' &&
          needs.binary-container.result == 'success' &&
          (!inputs.lint_go ||
           (needs.lint-go-host.result == 'success' &&
            needs.lint-go-container.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    container:
      image: &package-image ghcr.io/engity-com/build-images/build:debian12-amd64@sha256:983cf2ba65a5809b8d7f2e4e70830dedee3163c2d75e9d4c9c828463b7a86c27
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - name: Cache images dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/dependencies/images
          key: images-dependencies
          restore-keys: images-dependencies

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: package
          context: *package-image

      - name: Lint licenses
        if: inputs.lint_reuse
        run: mise run lint:reuse

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: var/dist

      - *install-go-dependencies

      - name: Set reproducible build time
        run: mise run ci:write-build-epoch

      - name: Package
        run: mise run build:go:package

      - name: Archive package results
        if: inputs.upload_dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: dist
          path: |
            var/dist/**/*
