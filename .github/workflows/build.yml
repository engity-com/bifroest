name: Build and package

on:
  workflow_call:
    inputs:
      test_host_matrix:
        required: true
        type: string
      test_container_matrix:
        required: true
        type: string
      binary_host_matrix:
        required: true
        type: string
      binary_container_matrix:
        required: true
        type: string
      ref:
        type: string
        default: ""
      commit:
        type: string
        default: ""
      lint_go:
        type: boolean
        default: false
      lint_reuse:
        type: boolean
        default: false
      upload_dist:
        type: boolean
        default: false
    secrets:
      MACOS_DEVELOPER_ID_CERTIFICATE:
        required: false
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: false
      MACOS_SIGNING_IDENTITY:
        required: false
      MACOS_APP_STORE_CONNECT_KEY:
        required: false
      MACOS_APP_STORE_CONNECT_KEY_ID:
        required: false
      MACOS_APP_STORE_CONNECT_ISSUER_ID:
        required: false

env:
  GITHUB_TOKEN: ${{ github.token }}
  BIFROEST_VENDOR: "Engity GmbH"

jobs:
  browser:
    name: Browser assets and inventory
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      # WASM helpers and browser integration use static builds. Native PAM
      # remains covered by test-container's prepared build image.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: &mise-options
          version: 2026.10.17
          # Go is the only global installer prerequisite; other tools are task-owned.
          cache_save_post: true
          cache_key: mise-task-tools-v1-{{platform}}-{{version}}-${{ github.job }}-{{file_hash}}-${{ hashFiles('mise.tools.yaml') }}

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: browser-assets
          context: cgo0

      - name: Install frozen dependencies without lifecycle scripts
        run: mise -C web run install:web

      - name: Build browser before any release binary
        run: mise -C web run build:web

      - name: Check browser build inventory
        run: mise run test:web:release

      - name: Upload exact browser assets for every binary host
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-assets
          path: pkg/webui/assets
          retention-days: 1
          if-no-files-found: error

      - name: Upload browser client fixture for HTTPS scenarios
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-core
          path: var/webui-client-build
          retention-days: 1
          if-no-files-found: error

  test-static:
    name: Static Linux core tests
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      CGO_ENABLED: "0"
      GOFLAGS: "-p=2"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          # Retain the previous combined job's static-core cache identity.
          scope: browser
          context: cgo0
          build-cache: "true"

      - &download-browser-assets
        name: Download verified browser assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-assets
          path: pkg/webui/assets

      - name: Test full static Linux core with pinned WebCrypto runtime
        run: mise run test:go:native

      - &summarize-go-tests
        name: Summarize Go tests even after failure
        if: always()
        shell: bash
        run: |
          for report in var/test-report/*.jsonl; do
            if [ -f "$report" ]; then
              {
                printf '### Slowest Go tests: %s\n\n```text\n' "$(basename "$report" .jsonl)"
                mise run ci:go:slowest -- --num 15 --threshold 0s --jsonfile "$report"
                printf '```\n\nCached test durations may come from a previous run.\n\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload static Linux test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-static-linux
          path: var/test-report/
          retention-days: 7
          if-no-files-found: warn

  test-web:
    name: Browser source tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ""
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go modules for browser proof helpers
        uses: ./.github/actions/cache-go
        with:
          scope: test-web
          context: cgo0

      - name: Install frozen dependencies without lifecycle scripts
        run: mise -C web run install:web

      - name: Check browser sources
        run: mise -C web run lint:web

      - name: Install Chromium
        run: mise -C web run install:web:browser

      - name: Test browser sources and real profile restart
        run: mise -C web run test:web

  test-browser:
    name: Built HTTPS browser ${{ matrix.shard }}
    needs: browser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    env:
      GITHUB_TOKEN: ""
      CGO_ENABLED: "0"
      GOFLAGS: "-p=2"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Reuse static core Go builds without new shard snapshots
        uses: ./.github/actions/cache-go
        with:
          scope: browser
          context: cgo0
          build-cache: restore-only

      - name: Install frozen dependencies without lifecycle scripts
        run: mise -C web run install:web

      - name: Install Chromium
        run: mise -C web run install:web:browser

      - *download-browser-assets

      - name: Download browser client fixture before HTTPS scenarios
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-test-core
          path: var/webui-client-build

      - name: Test isolated built HTTPS browser scenarios
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: mise -C web run test:go:browser -- --shard "$SHARD"

      - *summarize-go-tests

      - name: Upload browser shard test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-browser-${{ strategy.job-index }}
          path: var/test-report/
          retention-days: 7
          if-no-files-found: warn

  test-host:
    name: Tests ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_host_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ""
      GOFLAGS: "-p=2"
      # Keep disk-heavy Windows fixtures within the existing package timeout.
      GO_TEST_PARALLELISM: ${{ matrix.os == 'windows' && '1' || '2' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-host
          context: cgo0
          build-cache: "true"

      - &install-go-dependencies
        name: Install dependencies
        shell: bash
        run: &install-go-script |
          for attempt in 1 2 3; do
            if mise run install:go; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "::warning::Go module download failed (attempt ${attempt}/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Test
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run test:go:native

      - *summarize-go-tests

      - name: Upload host test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: var/test-report/
          retention-days: 7
          if-no-files-found: warn

  lint-go-host:
    name: Go lint ${{ matrix.os }}
    if: inputs.lint_go
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_host_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ""
      GOFLAGS: "-p=2"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: lint-go-host
          context: cgo0

      - *install-go-dependencies

      - name: Lint Go
        run: mise run lint:go

  lint-lua:
    name: Lua source lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      MISE_GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Install Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y luarocks
          sudo luarocks install luacheck 1.2.0-1

      - name: Check Lua source and formatting without writing
        run: mise run lint:lua

  test-policy:
    name: Offline policy CLI ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # test_host_matrix contains only Darwin/Windows; Linux uses a separate
      # container matrix. These offline CLI checks need a native Linux job too.
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: darwin
            runner: macos-15
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      MISE_GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-policy
          context: cgo0

      - *install-go-dependencies

      - name: Check native offline policy CLI and reports
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
        run: mise run test:policy

      - name: Upload policy reports even after a failed check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: policy-reports-${{ matrix.os }}
          path: var/policy-ci/reports/
          if-no-files-found: warn
          retention-days: 7

  test-policy-oci:
    name: Offline policy native/OCI parity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      MISE_GITHUB_TOKEN: ""
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-policy-oci
          context: cgo0

      - *install-go-dependencies

      - name: Check restricted OCI execution against the native CLI
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
        run: mise run test:policy:oci

      - name: Upload parity reports even after a failed check
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: policy-oci-reports-linux
          path: var/policy-oci/reports/
          if-no-files-found: warn
          retention-days: 7

  test-container:
    name: Tests ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-container
          context: native-${{ matrix.image }}
          build-cache: "true"

      - &configure-container-git
        name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - *install-go-dependencies

      - &install-asciinema
        name: Install asciinema compatibility tool
        env:
          MISE_GITHUB_TOKEN: ""
          ASCIINEMA_VERSION: 3.2.1
          ASCIINEMA_SHA256: bec9781bc8f297a9d3d74ff60205599507f2abba1183578b8b2f22be4c999214
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/asciinema" \
            "https://github.com/asciinema/asciinema/releases/download/v${ASCIINEMA_VERSION}/asciinema-x86_64-unknown-linux-musl"
          printf '%s  %s\n' "$ASCIINEMA_SHA256" "$RUNNER_TEMP/asciinema" | sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/asciinema"
          test "$("$RUNNER_TEMP/asciinema" --version)" = "asciinema ${ASCIINEMA_VERSION}"
          echo "ASCIINEMA=$RUNNER_TEMP/asciinema" >> "$GITHUB_ENV"

      - name: Test
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run test:go:coverage

      - *summarize-go-tests

      - name: Upload native Linux test reports and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-native-${{ matrix.os }}
          path: |
            var/test-report/
            var/profile.cov
          retention-days: 7
          if-no-files-found: warn

  test-race:
    name: Race tests ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: test-race
          context: native-${{ matrix.image }}
          build-cache: "true"

      - *configure-container-git

      - *install-go-dependencies

      - *install-asciinema

      - name: Test with race detector
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run test:go:race

      - *summarize-go-tests

      - name: Upload race test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports-race-${{ matrix.os }}
          path: var/test-report/
          retention-days: 7
          if-no-files-found: warn

  lint-go-container:
    name: Go lint ${{ matrix.os }}
    if: inputs.lint_go
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.test_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_TOKEN: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: lint-go-container
          context: native-${{ matrix.image }}

      - *configure-container-git

      - *install-go-dependencies

      - name: Lint Go
        run: mise run lint:go

  binary-host:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}
    needs: browser
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.binary_host_matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: binary-host
          context: ${{ matrix.os }}-${{ matrix.arch }}

      - *install-go-dependencies

      - name: Set reproducible build time
        run: mise run ci:write-build-epoch

      - name: Download verified browser assets before Go embedding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-assets
          path: pkg/webui/assets

      - name: Ensure Intel execution under Rosetta
        if: matrix.os == 'darwin' && contains(matrix.arch, 'amd64') && runner.arch == 'ARM64'
        shell: bash
        run: |
          if ! /usr/bin/arch -x86_64 /usr/bin/true; then
            sudo /usr/sbin/softwareupdate --install-rosetta --agree-to-license
          fi
          /usr/bin/arch -x86_64 /usr/bin/true

      - name: Build all target variants
        run: mise run build:go:binary -- --os=${{ matrix.os }} --arch="${{ matrix.arch }}"
        env:
          BIFROEST_DARWIN_CERTIFICATE: ${{ matrix.os == 'darwin' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE || '' }}
          BIFROEST_DARWIN_CERTIFICATE_PASSWORD: ${{ matrix.os == 'darwin' && secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD || '' }}
          BIFROEST_DARWIN_SIGNING_IDENTITY: ${{ matrix.os == 'darwin' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          BIFROEST_DARWIN_NOTARY_KEY: ${{ matrix.os == 'darwin' && secrets.MACOS_APP_STORE_CONNECT_KEY || '' }}
          BIFROEST_DARWIN_NOTARY_KEY_ID: ${{ matrix.os == 'darwin' && secrets.MACOS_APP_STORE_CONNECT_KEY_ID || '' }}
          BIFROEST_DARWIN_NOTARY_ISSUER_ID: ${{ matrix.os == 'darwin' && secrets.MACOS_APP_STORE_CONNECT_ISSUER_ID || '' }}

      - name: Upload all target variants and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: var/dist
          retention-days: 1
          if-no-files-found: error

  binary-container:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}
    needs: browser
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(inputs.binary_container_matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install host Node runtime dependency for MISE
        shell: bash
        run: |
          host_arch="$(dpkg --print-architecture)"
          if [ "$(dpkg-query -W -f='${db:Status-Status}' "libatomic1:$host_arch" 2>/dev/null || true)" != installed ]; then
            apt-get update
            apt-get install --no-install-recommends -y "libatomic1:$host_arch"
          fi

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: binary-container
          context: ${{ matrix.image }}-${{ matrix.os }}-${{ matrix.arch }}

      - *install-go-dependencies

      - name: Set reproducible build time
        run: mise run ci:write-build-epoch

      - name: Download verified browser assets before Go embedding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: browser-assets
          path: pkg/webui/assets

      - name: Build all target variants
        run: mise run build:go:binary -- --os=${{ matrix.os }} --arch="${{ matrix.arch }}"

      - name: Upload all target variants and metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: var/dist
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble packages
    needs: [browser, binary-host, binary-container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      publish: ${{ steps.prepare.outputs.publish }}
    container:
      image: &package-image ghcr.io/engity-com/build-images/build:debian12-amd64@sha256:331bf01d9aa1419251131f79d131af5c831eba663ee555b0997f4ff2b711ceec
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - name: Cache images dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/dependencies/images
          key: images-dependencies
          restore-keys: images-dependencies

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        uses: ./.github/actions/cache-go
        with:
          scope: package
          context: *package-image

      - name: Lint licenses
        if: inputs.lint_reuse
        run: mise run lint:reuse

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: var/dist

      - name: Install dependencies
        shell: bash
        run: *install-go-script

      - name: Set reproducible build time
        run: mise run ci:write-build-epoch

      - name: Prepare packages without publishing
        id: prepare
        run: mise run build:go:prepare-packages

      - name: Transfer prepared packages for gated publication
        if: steps.prepare.outputs.publish == 'true' || inputs.upload_dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prepared-packages
          path: var/dist
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  package:
    name: Package
    needs:
      [
        test-host,
        test-container,
        test-race,
        browser,
        test-static,
        test-web,
        test-browser,
        lint-go-host,
        lint-go-container,
        binary-host,
        binary-container,
        assemble,
      ]
    # This required check must fail, not skip, when a dependency fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    container:
      image: *package-image
    env:
      GITHUB_REF_NAME: ${{ inputs.ref || github.ref_name }}
      GITHUB_SHA: ${{ inputs.commit || github.sha }}
    steps:
      - name: Require successful tests, race, binaries and enabled Go lint
        shell: bash
        env:
          TEST_HOST_RESULT: ${{ needs.test-host.result }}
          TEST_CONTAINER_RESULT: ${{ needs.test-container.result }}
          TEST_RACE_RESULT: ${{ needs.test-race.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          TEST_STATIC_RESULT: ${{ needs.test-static.result }}
          TEST_WEB_RESULT: ${{ needs.test-web.result }}
          TEST_BROWSER_RESULT: ${{ needs.test-browser.result }}
          BINARY_HOST_RESULT: ${{ needs.binary-host.result }}
          BINARY_CONTAINER_RESULT: ${{ needs.binary-container.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          LINT_GO: ${{ inputs.lint_go }}
          LINT_GO_HOST_RESULT: ${{ needs.lint-go-host.result }}
          LINT_GO_CONTAINER_RESULT: ${{ needs.lint-go-container.result }}
        run: |
          failed=0
          require_success() {
            if [ "$2" != success ]; then
              echo "::error::Required job $1 did not succeed (result: $2)."
              failed=1
            fi
          }
          require_success test-host "$TEST_HOST_RESULT"
          require_success test-container "$TEST_CONTAINER_RESULT"
          require_success test-race "$TEST_RACE_RESULT"
          require_success browser "$BROWSER_RESULT"
          require_success test-static "$TEST_STATIC_RESULT"
          require_success test-web "$TEST_WEB_RESULT"
          require_success test-browser "$TEST_BROWSER_RESULT"
          require_success binary-host "$BINARY_HOST_RESULT"
          require_success binary-container "$BINARY_CONTAINER_RESULT"
          require_success assemble "$ASSEMBLE_RESULT"
          if [ "$LINT_GO" = true ]; then
            require_success lint-go-host "$LINT_GO_HOST_RESULT"
            require_success lint-go-container "$LINT_GO_CONTAINER_RESULT"
          fi
          exit "$failed"

      - name: Checkout code
        if: &finalize-packages needs.assemble.outputs.publish == 'true' || inputs.upload_dist
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit || inputs.ref }}

      - name: Git configure
        if: *finalize-packages
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install MISE
        if: *finalize-packages
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go
        if: *finalize-packages
        uses: ./.github/actions/cache-go
        with:
          scope: package
          context: *package-image

      - name: Download prepared packages
        if: *finalize-packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: prepared-packages
          path: var/dist

      - name: Install dependencies
        if: *finalize-packages
        shell: bash
        run: *install-go-script

      - name: Set reproducible build time
        if: *finalize-packages
        run: mise run ci:write-build-epoch

      - name: Verify and publish prepared packages without rebuilding
        if: *finalize-packages
        run: mise run build:go:publish-packages

      - name: Archive package results
        if: inputs.upload_dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 1
          name: dist
          path: |
            var/dist/**/*
            !var/dist/prepared-packages.json
            !var/dist/prepared-images/**
