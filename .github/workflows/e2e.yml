name: End-to-End Tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Keep non-PR runs independent, including while pending.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  files-changed:
    name: Detect file changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for backend file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: .github/filters.yml

  runtime:
    name: ${{ matrix.suite }} with docker and podman
    needs: files-changed
    if: always() && (github.event_name != 'pull_request' || needs.files-changed.outputs.go == 'true')
    runs-on: ubuntu-latest
    # Both runtimes retain their existing execution budget.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        suite:
          - local
          - docker
          - ssh
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install --yes podman

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare and check browser network isolation
        if: matrix.suite == 'docker'
        shell: bash
        run: &prepare-browser-network |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes passt
          if pasta --quiet --config-net --ipv4-only --splice-only --tcp-ports none --udp-ports none --tcp-ns none --udp-ns none -- /bin/sh -c 'exec "$@"' bifroest-browser /bin/true; then
            exit 0
          fi
          sudo cat /etc/apparmor.d/usr.bin.pasta /etc/apparmor.d/abstractions/pasta || true
          sudo journalctl -k --since '-5 min' --no-pager | grep -E 'apparmor|pasta' || true
          exit 1

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: &mise-options
          version: 2026.10.17
          cache_save_post: true
          cache_key: mise-task-tools-v1-{{platform}}-{{version}}-${{ github.job }}-{{file_hash}}-${{ hashFiles('mise.tools.yaml') }}

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: e2e-runtime
          context: ${{ matrix.suite }}

      - &install-go-dependencies
        name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mise run install:go; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "::warning::Go module download failed (attempt ${attempt}/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Prepare shared browser E2E
        if: matrix.suite == 'docker'
        run: |
          mise -C web run install:web
          mise -C web run build:web
          mise -C web run install:web:browser

      - name: Run Docker end-to-end suite
        id: docker-suite
        env:
          BIFROEST_E2E_RUNTIME: docker
        run: mise run test:e2e:${{ matrix.suite }}

      - name: Verify shared Docker workload through browser and OpenSSH with Docker
        if: ${{ !cancelled() && matrix.suite == 'docker' && steps.docker-suite.outcome != 'skipped' }}
        env:
          BIFROEST_E2E_RUNTIME: docker
        run: mise run test:e2e:docker:browser

      - name: Collect Docker runtime diagnostics
        if: failure() && steps.docker-suite.outcome != 'skipped'
        shell: bash
        env:
          BIFROEST_E2E_RUNTIME: docker
        run: &collect-runtime-diagnostics |
          log_dir="var/e2e/${BIFROEST_E2E_RUNTIME}/runtime-containers"
          mkdir -p "${log_dir}"
          timeout 30s "${BIFROEST_E2E_RUNTIME}" ps --all >"${log_dir}/list.txt" 2>&1 || true
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            timeout 30s "${BIFROEST_E2E_RUNTIME}" logs "${id}" >"${log_dir}/${id}.log" 2>&1 || true
          done < <(timeout 30s "${BIFROEST_E2E_RUNTIME}" ps --all --quiet 2>/dev/null)

      # An earlier Docker failure must not hide the independent Podman result.
      # No continue-on-error: either runtime failing still fails the job.
      - name: Run Podman end-to-end suite
        id: podman-suite
        if: ${{ !cancelled() && steps.docker-suite.outcome != 'skipped' }}
        env:
          BIFROEST_E2E_RUNTIME: podman
        run: mise run test:e2e:${{ matrix.suite }}

      - name: Verify shared Docker workload through browser and OpenSSH with Podman
        if: ${{ !cancelled() && matrix.suite == 'docker' && steps.podman-suite.outcome != 'skipped' }}
        env:
          BIFROEST_E2E_RUNTIME: podman
        run: mise run test:e2e:docker:browser

      - name: Collect Podman runtime diagnostics
        if: failure() && steps.podman-suite.outcome != 'skipped'
        shell: bash
        env:
          BIFROEST_E2E_RUNTIME: podman
        run: *collect-runtime-diagnostics

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ matrix.suite }}-docker-and-podman
          path: var/e2e/**/*
          if-no-files-found: ignore
          retention-days: 7

  authorization:
    name: htpasswd and OIDC authorization
    needs: files-changed
    if: always() && (github.event_name != 'pull_request' || needs.files-changed.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: e2e-authorization

      - *install-go-dependencies

      - name: Run authorization end-to-end suite
        run: mise run test:e2e:authorization

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-authorization
          path: var/e2e/**/*
          if-no-files-found: ignore
          retention-days: 7

  pam:
    name: native PAM RememberMe with browser
    needs: files-changed
    if: always() && (github.event_name != 'pull_request' || needs.files-changed.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIFROEST_E2E_RUNTIME: docker
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: e2e-pam-browser

      - name: Prepare pinned browser toolchain
        run: |
          mise run install:web
          mise run install:web:browser

      - name: Verify native PAM policy and actual browser resumption in owned container
        run: mise run test:e2e:pam

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-native-pam-browser
          path: var/e2e/pam-*
          if-no-files-found: ignore
          retention-days: 7

  darwin:
    name: darwin
    needs: files-changed
    if: always() && (github.event_name != 'pull_request' || needs.files-changed.outputs.go == 'true')
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: e2e-darwin

      - *install-go-dependencies

      - name: Run Darwin end-to-end suite
        run: mise run test:e2e:darwin

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-darwin
          path: var/e2e/**/*
          if-no-files-found: ignore
          retention-days: 7

  kind:
    name: kubernetes with kind
    needs: files-changed
    if: always() && (github.event_name != 'pull_request' || needs.files-changed.outputs.go == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BIFROEST_E2E_RUNTIME: docker
      KIND_EXPERIMENTAL_PROVIDER: docker
      CGO_ENABLED: "0"
    steps:
      - name: Install Podman
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install --yes podman

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare and check browser network isolation
        shell: bash
        run: *prepare-browser-network

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with: *mise-options

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: e2e-kubernetes
          context: docker-and-podman

      - *install-go-dependencies

      - name: Prepare actual Kubernetes browser E2E
        run: |
          mise -C web run install:web
          mise -C web run build:web
          mise -C web run install:web:browser

      - name: Run Kubernetes end-to-end suite with Docker
        id: docker-suite
        run: mise run test:e2e:kubernetes

      - name: Verify shared Kubernetes workload through browser and OpenSSH with Docker
        if: ${{ !cancelled() && steps.docker-suite.outcome != 'skipped' }}
        run: mise run test:e2e:kubernetes:browser

      - name: Collect Kubernetes Docker diagnostics
        if: failure() && steps.docker-suite.outcome != 'skipped'
        shell: bash
        run: &collect-kubernetes-diagnostics |
          log_dir="var/e2e/${BIFROEST_E2E_RUNTIME}"
          mkdir -p "${log_dir}/runtime-containers"
          timeout 30s "${BIFROEST_E2E_RUNTIME}" ps --all >"${log_dir}/runtime-containers/list.txt" 2>&1 || true
          while IFS= read -r id; do
            [ -n "${id}" ] || continue
            timeout 30s "${BIFROEST_E2E_RUNTIME}" logs "${id}" >"${log_dir}/runtime-containers/${id}.log" 2>&1 || true
          done < <(timeout 30s "${BIFROEST_E2E_RUNTIME}" ps --all --quiet 2>/dev/null)
          if [ -s var/e2e/kind-cluster ]; then
            cluster="$(<var/e2e/kind-cluster)"
            timeout 5m kind export logs "${log_dir}/${cluster}-kind" --name "${cluster}" || true
          fi

      - name: Run Kubernetes end-to-end suite with Podman
        id: podman-suite
        if: ${{ !cancelled() && steps.docker-suite.outcome != 'skipped' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          BIFROEST_E2E_RUNTIME: podman
          KIND_EXPERIMENTAL_PROVIDER: podman
        run: mise run test:e2e:kubernetes

      - name: Verify shared Kubernetes workload through browser and OpenSSH with Podman
        if: ${{ !cancelled() && steps.podman-suite.outcome != 'skipped' }}
        env:
          BIFROEST_E2E_RUNTIME: podman
          KIND_EXPERIMENTAL_PROVIDER: podman
        run: mise run test:e2e:kubernetes:browser

      - name: Collect Kubernetes Podman diagnostics
        if: failure() && steps.podman-suite.outcome != 'skipped'
        shell: bash
        env:
          BIFROEST_E2E_RUNTIME: podman
          KIND_EXPERIMENTAL_PROVIDER: podman
        run: *collect-kubernetes-diagnostics

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-kubernetes
          path: var/e2e/**/*
          if-no-files-found: ignore
          retention-days: 7
