name: "Release"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BIFROEST_VENDOR: "Engity GmbH"

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released (vX.Y.Z, vX.Y.Z-alphaN, or vX.Y.Z-betaN)"
        required: true

jobs:
  evaluate:
    name: "Evaluate"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      version: ${{ steps.release-version.outputs.version }}
      commit: ${{ steps.refs.outputs.commit }}
      test-host-matrix: ${{ steps.refs.outputs.test-host-matrix }}
      test-container-matrix: ${{ steps.refs.outputs.test-container-matrix }}
      binary-host-matrix: ${{ steps.refs.outputs.binary-host-matrix }}
      binary-container-matrix: ${{ steps.refs.outputs.binary-container-matrix }}
    permissions:
      contents: read
    steps:
      - name: Resolve release version
        id: release-version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            release) release_tag="${RELEASE_EVENT_TAG}" ;;
            workflow_dispatch) release_tag="${VERSION_INPUT}" ;;
            *) echo "Unsupported event: ${EVENT_NAME}" >&2; exit 1 ;;
          esac
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta)[1-9][0-9]*)?$'
          if [[ ! "${release_tag}" =~ ${semver_re} ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          expected_prerelease=false
          if [[ -n "${BASH_REMATCH[5]}" ]]; then
            expected_prerelease=true
          fi
          release_state="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" --jq '[.draft, .prerelease] | @tsv')"
          read -r draft prerelease <<< "${release_state}"
          if [[ "${draft}" != false || "${prerelease}" != "${expected_prerelease}" ]]; then
            echo "Release ${release_tag} must be published with prerelease=${expected_prerelease} (draft=${draft}, prerelease=${prerelease})" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${release_tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release-version.outputs.release_tag }}

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Evaluate build environment
        id: refs
        env:
          GITHUB_REF_NAME: ${{ steps.release-version.outputs.release_tag }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          mise run ci:evaluate-environment

  build:
    name: Build and release packages
    needs: evaluate
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      test_host_matrix: ${{ needs.evaluate.outputs.test-host-matrix }}
      test_container_matrix: ${{ needs.evaluate.outputs.test-container-matrix }}
      binary_host_matrix: ${{ needs.evaluate.outputs.binary-host-matrix }}
      binary_container_matrix: ${{ needs.evaluate.outputs.binary-container-matrix }}
      ref: ${{ needs.evaluate.outputs.release_tag }}
      commit: ${{ needs.evaluate.outputs.commit }}
      lint_reuse: true
    secrets:
      MACOS_DEVELOPER_ID_CERTIFICATE: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_APP_STORE_CONNECT_KEY: ${{ secrets.MACOS_APP_STORE_CONNECT_KEY }}
      MACOS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.MACOS_APP_STORE_CONNECT_KEY_ID }}
      MACOS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.MACOS_APP_STORE_CONNECT_ISSUER_ID }}

  documentation:
    name: "Documentation"
    needs: [ evaluate, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Create temp repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          path: var/doc
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Setup Git
        working-directory: var/doc
        run: |
          git config user.email "info@engity.com"
          git config user.name  "Engity Bot"

      - name: Prepare temp repository
        working-directory: var/doc
        run: |
          git branch -d temp-deploy || true
          git switch --orphan temp-deploy

      - name: Install MISE
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('docs/requirements.txt') }}

      - name: Install dependencies
        run: mise run install:docs

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ needs.evaluate.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p var/release
          gh release download "${RELEASE_TAG}" --pattern bifroest-release-manifest.json --dir var/release
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].name' > var/release/assets.txt

      - name: Build
        env:
          RELEASE_ASSETS_FILE: var/release/assets.txt
          RELEASE_MANIFEST_FILE: var/release/bifroest-release-manifest.json
          VERSION: ${{ needs.evaluate.outputs.version }}
        run: mise run build:docs

      - name: Deploy
        working-directory: var/doc
        env:
          VERSION: ${{ needs.evaluate.outputs.version }}
        run: |
          git add -A
          git commit -m "Release v${VERSION}"
          git push --delete origin "docs/v${VERSION}" || true
          git tag -d "docs/v${VERSION}" || true
          git tag -a "docs/v${VERSION}" -m "Release v${VERSION}"
          git push origin "docs/v${VERSION}"
          echo "Documentation is available at https://bifroest.engity.org/v${VERSION}/" >> "$GITHUB_STEP_SUMMARY"
