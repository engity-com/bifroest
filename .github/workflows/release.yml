name: "Release"

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BIFROEST_VENDOR: "Engity GmbH"

on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released (syntax: v<major>.<minor>.<patch>)"
        required: true

jobs:
  evaluate:
    name: "Evaluate"
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      version: ${{ steps.release-version.outputs.version }}
      commit: ${{ steps.refs.outputs.commit }}
      test-host-matrix: ${{ steps.refs.outputs.test-host-matrix }}
      test-container-matrix: ${{ steps.refs.outputs.test-container-matrix }}
      binary-host-matrix: ${{ steps.refs.outputs.binary-host-matrix }}
      binary-container-matrix: ${{ steps.refs.outputs.binary-container-matrix }}
    permissions:
      contents: read
    steps:
      - name: Resolve release version
        id: release-version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            release) release_tag="${RELEASE_EVENT_TAG}" ;;
            workflow_dispatch) release_tag="${VERSION_INPUT}" ;;
            *) echo "Unsupported event: ${EVENT_NAME}" >&2; exit 1 ;;
          esac
          prerelease_identifier='(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)'
          semver_re="^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-${prerelease_identifier}(\\.${prerelease_identifier})*)?$"
          if [[ ! "${release_tag}" =~ ${semver_re} ]]; then
            echo "Invalid release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${release_tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release-version.outputs.release_tag }}

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Evaluate build environment
        id: refs
        env:
          GITHUB_REF_NAME: ${{ steps.release-version.outputs.release_tag }}
        run: |
          export GITHUB_SHA="$(git rev-parse HEAD)"
          mise run ci:evaluate-environment

  test-host:
    name: Tests ${{ matrix.os }}
    needs: evaluate
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.evaluate.outputs.test-host-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: mise run install:go

      - name: Test
        run: mise run test:go

  test-container:
    name: Tests ${{ matrix.os }}
    needs: evaluate
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.evaluate.outputs.test-container-matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Git configure
        run: git config --global --add safe.directory $(pwd)

      - name: Install dependencies
        run: mise run install:go

      - name: Install asciinema compatibility tool
        env:
          MISE_GITHUB_TOKEN: ""
          ASCIINEMA_VERSION: 3.2.1
          ASCIINEMA_SHA256: bec9781bc8f297a9d3d74ff60205599507f2abba1183578b8b2f22be4c999214
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/asciinema" \
            "https://github.com/asciinema/asciinema/releases/download/v${ASCIINEMA_VERSION}/asciinema-x86_64-unknown-linux-musl"
          printf '%s  %s\n' "$ASCIINEMA_SHA256" "$RUNNER_TEMP/asciinema" | sha256sum --check -
          chmod 0755 "$RUNNER_TEMP/asciinema"
          test "$("$RUNNER_TEMP/asciinema" --version)" = "asciinema ${ASCIINEMA_VERSION}"
          echo "ASCIINEMA=$RUNNER_TEMP/asciinema" >> "$GITHUB_ENV"

      - name: Test
        run: mise run test:go

      - name: Test with race detector
        run: mise run test:go:race

  package-binary-host:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}/${{ matrix.edition }}
    needs: [ evaluate, test-host, test-container ]
    strategy:
      matrix: ${{ fromJSON(needs.evaluate.outputs.binary-host-matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      GITHUB_REF_NAME: ${{ needs.evaluate.outputs.release_tag }}
      GITHUB_SHA: ${{ needs.evaluate.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Set reproducible build time
        if: matrix.os == 'linux'
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Set reproducible build time on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $epoch = git show -s --format=%ct HEAD
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: mise run install:go

      - name: Build binary
        run: mise run build:go:binary -- --os=${{ matrix.os }} --arch=${{ matrix.arch }} --edition=${{ matrix.edition }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.edition }}
          path: var/dist
          retention-days: 1
          if-no-files-found: error

  package-binary-container:
    name: Binary ${{ matrix.os }}/${{ matrix.arch }}/${{ matrix.edition }}
    needs: [ evaluate, test-host, test-container ]
    strategy:
      matrix: ${{ fromJSON(needs.evaluate.outputs.binary-container-matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      GITHUB_REF_NAME: ${{ needs.evaluate.outputs.release_tag }}
      GITHUB_SHA: ${{ needs.evaluate.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set reproducible build time
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Install dependencies
        run: mise run install:go

      - name: Build binary
        run: mise run build:go:binary -- --os=${{ matrix.os }} --arch=${{ matrix.arch }} --edition=${{ matrix.edition }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.edition }}
          path: var/dist
          retention-days: 1
          if-no-files-found: error

  package:
    name: "Package/Release"
    needs: [ evaluate, package-binary-host, package-binary-container ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    container:
      image: ghcr.io/engity-com/build-images/build:debian12-amd64@sha256:4c5969c27f1e4044b7f41118072505cdea482a39067549ebbb07961e948897c4
    env:
      GITHUB_REF_NAME: ${{ needs.evaluate.outputs.release_tag }}
      GITHUB_SHA: ${{ needs.evaluate.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Git configure
        run: git config --global --add safe.directory "$(pwd)"

      - name: Set reproducible build time
        run: |
          epoch="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache images dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/dependencies/images
          key: images-dependencies
          restore-keys: images-dependencies

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Lint licenses
        run: mise run lint:reuse

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: var/dist

      - name: Install dependencies
        run: mise run install:go

      - name: Build/Release
        run: mise run build:go:package

  documentation:
    name: "Documentation"
    needs: [ evaluate, package ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Create temp repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          path: var/doc
          ref: ${{ needs.evaluate.outputs.release_tag }}

      - name: Setup Git
        working-directory: var/doc
        run: |
          git config user.email "info@engity.com"
          git config user.name  "Engity Bot"

      - name: Prepare temp repository
        working-directory: var/doc
        run: |
          git branch -d temp-deploy || true
          git switch --orphan temp-deploy

      - name: Install MISE
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('docs/requirements.txt') }}

      - name: Install dependencies
        run: mise run install:docs

      - name: Verify release assets
        env:
          RELEASE_TAG: ${{ needs.evaluate.outputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p var/release
          gh release download "${RELEASE_TAG}" --pattern bifroest-release-manifest.json --dir var/release
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].name' > var/release/assets.txt

      - name: Build
        env:
          RELEASE_ASSETS_FILE: var/release/assets.txt
          RELEASE_MANIFEST_FILE: var/release/bifroest-release-manifest.json
          VERSION: ${{ needs.evaluate.outputs.version }}
        run: mise run build:docs

      - name: Deploy
        working-directory: var/doc
        env:
          VERSION: ${{ needs.evaluate.outputs.version }}
        run: |
          git add -A
          git commit -m "Release v${VERSION}"
          git push --delete origin "docs/v${VERSION}" || true
          git tag -d "docs/v${VERSION}" || true
          git tag -a "docs/v${VERSION}" -m "Release v${VERSION}"
          git push origin "docs/v${VERSION}"
          echo "Documentation is available at https://bifroest.engity.org/v${VERSION}/" >> "$GITHUB_STEP_SUMMARY"
