name: Windows ConPTY full-fixture probe

on:
  push:
    branches: [diag/windows-conpty-fixture]

permissions:
  contents: read

jobs:
  fixture:
    name: Original Nano Server 2022 fixture with cold-start observations
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      BIFROEST_TEST_NANOSERVER: "1"
      BIFROEST_TEST_NANOSERVER_ISOLATION: process
      BIFROEST_TEST_NANOSERVER_VERSION: "2022"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.17
          cache_save_post: true
          cache_key: mise-task-tools-v1-{{platform}}-{{version}}-${{ github.job }}-{{file_hash}}-${{ hashFiles('mise.tools.yaml') }}

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: nanoserver
          context: "2022"

      - name: Install dependencies
        run: mise run install:go

      - name: Install frozen browser dependencies
        run: mise -C web run install:web

      - name: Build browser before Go embedding
        run: mise -C web run build:web

      - name: Install pinned Chromium for actual native browser test
        run: mise -C web run install:web:browser

      - name: Set reproducible build time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ""
        run: mise run ci:write-build-epoch

      - name: Build native Windows binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIFROEST_VENDOR: Engity GmbH
          MISE_GITHUB_TOKEN: ""
        run: mise run build:go:binary -- --os=windows --arch=amd64 --edition=generic

      - name: Test Windows local authorization
        run: mise run test:go:windows-local

      - name: Start Windows Docker daemon
        shell: pwsh
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') {
            Start-Service docker
          }

      - name: Observe original complete Windows container fixture
        env:
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
        run: mise run diag:windows:conpty-fixture

      - name: Upload native browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: conpty-full-fixture-browser-2022
          path: var/e2e/windows-browser-*
          if-no-files-found: ignore
          retention-days: 7
