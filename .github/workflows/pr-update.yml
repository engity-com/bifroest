name: Pull-Requests Updates

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{github.event.number}}

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - closed

jobs:
  build:
    runs-on: ubuntu-latest
    name: Inspect
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
      actions: write
      packages: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install MISE
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.17
          cache_save_post: true
          cache_key: mise-task-tools-v1-{{platform}}-{{version}}-${{ github.job }}-{{file_hash}}-${{ hashFiles('mise.tools.yaml') }}

      - name: Cache Go modules
        uses: ./.github/actions/cache-go
        with:
          scope: build-tools

      - name: Execute
        id: refs
        run: mise run ci:inspect-pr-action -- "${{github.event.action}}" "${{github.event.number}}" "${{github.event.label.name}}"
