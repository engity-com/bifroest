name: Nano Server Integration

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - .github/workflows/nanoserver.yml
      - .github/workflows/build.yml
      - cmd/bifroest/**
      - cmd/build/**
      - docs/reference/environment/local.md
      - go.mod
      - go.sum
      - internal/build/**
      - internal/conpty/**
      - mise.toml
      - pkg/configuration/**
      - pkg/authorization/**
      - pkg/environment/**
      - pkg/net/**
      - pkg/service/**
      - pkg/session/**
      - pkg/user/**
      - pkg/windowslocal/**
      - test/manual/s4u-probe/**
      - test/nanoserver/**
      - web/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep non-PR runs independent, including while pending.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-local:
    name: Windows local in Nano Server and Server Core ${{ matrix.windows }}
    strategy:
      fail-fast: false
      matrix:
        windows: ["2022", "2025"]
    runs-on: windows-${{ matrix.windows }}
    timeout-minutes: 25
    env:
      BIFROEST_TEST_NANOSERVER: "1"
      BIFROEST_TEST_NANOSERVER_ISOLATION: process
      BIFROEST_TEST_NANOSERVER_VERSION: ${{ matrix.windows }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install MISE
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9

      - name: Cache Go modules and build
        uses: ./.github/actions/cache-go
        with:
          scope: nanoserver
          context: ${{ matrix.windows }}

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if mise run install:go; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            delay=$((attempt * 5))
            echo "::warning::Go module download failed (attempt ${attempt}/3); retrying in ${delay}s"
            sleep "$delay"
          done

      - name: Install pinned browser toolchain
        run: mise -C web install

      - name: Install frozen browser dependencies
        run: mise -C web run install:web

      - name: Build browser before Go embedding
        run: mise -C web run build:web

      - name: Install pinned Chromium for actual native browser test
        run: mise -C web run install:web:browser

      - name: Set reproducible build time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_GITHUB_TOKEN: ""
        run: mise run ci:write-build-epoch

      - name: Build native Windows binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIFROEST_VENDOR: Engity GmbH
          MISE_GITHUB_TOKEN: ""
        run: mise run build:go:binary -- --os=windows --arch=amd64 --edition=generic

      - name: Test Windows local authorization
        run: go test ./pkg/configuration ./pkg/authorization ./pkg/windowslocal ./pkg/environment ./pkg/service -run '^(TestWindowsLocal.*|TestLocalWindowsAuthorizationAccountReplacement|TestLocalSAMIntegration|TestSIDMatching|TestMissingIdentity|TestNames|TestFieldsWithoutConfiguration|TestInvalidCredentials|TestAccountUnavailable|TestS4ULogonBuffer)$'

      - name: Start Windows Docker daemon
        shell: pwsh
        run: |
          $service = Get-Service docker -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Running') {
            Start-Service docker
          }

      - name: Test pinned Windows container images
        env:
          GITHUB_TOKEN: ""
          MISE_GITHUB_TOKEN: ""
        shell: pwsh
        run: |
          $env:BIFROEST_TEST_NODE = (mise -C web which node).Trim()
          mise run test:e2e:nanoserver

      - name: Upload native Windows browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-windows-browser-${{ matrix.windows }}
          path: var/e2e/windows-browser-*
          if-no-files-found: ignore
          retention-days: 7
