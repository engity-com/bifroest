name: Continuous Integration

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BIFROEST_VENDOR: "Engity GmbH"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  files-changed:
    name: Detect file changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      docs: ${{ steps.changes.outputs.docs }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for backend file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: .github/filters.yml

  evaluate:
    name: Evaluate
    runs-on: ubuntu-latest
    outputs:
      commit: "${{ steps.refs.outputs.commit }}"
      version: "${{ steps.refs.outputs.version }}"
      ref: "${{ steps.refs.outputs.ref }}"
      pr: "${{ steps.refs.outputs.pr }}"
      stage-binary: "${{ steps.refs.outputs.stage-binary }}"
      stage-archive: "${{ steps.refs.outputs.stage-archive }}"
      stage-image: "${{ steps.refs.outputs.stage-image }}"
      stage-sbom: "${{ steps.refs.outputs.stage-sbom }}"
      stage-digest: "${{ steps.refs.outputs.stage-digest }}"
      stage-publish: "${{ steps.refs.outputs.stage-publish }}"
      test-host-matrix: "${{ steps.refs.outputs.test-host-matrix }}"
      test-container-matrix: "${{ steps.refs.outputs.test-container-matrix }}"
      binary-host-matrix: "${{ steps.refs.outputs.binary-host-matrix }}"
      binary-container-matrix: "${{ steps.refs.outputs.binary-container-matrix }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install MISE
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Execute
        id: refs
        run: |
          mise run ci:evaluate-environment

  reuse:
    name: REUSE lint ${{ matrix.os }}
    needs: evaluate
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.evaluate.outputs.test-container-matrix) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install MISE
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Git configure
        run: git config --global --add safe.directory $(pwd)

      - name: Lint licenses
        run: mise run lint:reuse

  build:
    name: Build packages
    needs: [ evaluate, files-changed ]
    if: needs.files-changed.outputs.go == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      test_host_matrix: ${{ needs.evaluate.outputs.test-host-matrix }}
      test_container_matrix: ${{ needs.evaluate.outputs.test-container-matrix }}
      binary_host_matrix: ${{ needs.evaluate.outputs.binary-host-matrix }}
      binary_container_matrix: ${{ needs.evaluate.outputs.binary-container-matrix }}
      lint_go: true
      upload_dist: ${{ needs.evaluate.outputs.stage-publish == 'true' }}

  documentation:
    name: Documentation
    needs: [ evaluate, files-changed ]
    if: needs.files-changed.outputs.docs == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create temp repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          path: var/doc

      - name: Setup Git
        working-directory: var/doc
        run: |
          git config user.email "info@engity.com"
          git config user.name  "Engity Bot"

      - name: Prepare temp repository
        working-directory: var/doc
        run: |
          git branch -d temp-deploy || true
          git switch --orphan temp-deploy

      - name: Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pip
          key: ${{ hashFiles('docs/requirements.txt') }}

      - name: Install MISE
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0

      - name: Install dependencies
        run: mise run install:docs

      - name: Build
        run: mise run build:docs

      - name: Deploy
        if: needs.evaluate.outputs.stage-publish == 'true' && needs.evaluate.outputs.pr
        working-directory: var/doc
        run: |
          git add -A
          git commit -m "Release PR-${{ needs.evaluate.outputs.pr }}"
          git push --delete origin "docs/pr-${{ needs.evaluate.outputs.pr }}" || true
          git tag -d "docs/pr-${{ needs.evaluate.outputs.pr }}" || true
          git tag -a "docs/pr-${{ needs.evaluate.outputs.pr }}" -m "Release PR-${{ needs.evaluate.outputs.pr }}"
          git push origin "docs/pr-${{ needs.evaluate.outputs.pr }}"
          echo "Documentation is available at https://bifroest.engity.org/pr-${{ needs.evaluate.outputs.pr }}/" >> "$GITHUB_STEP_SUMMARY"
