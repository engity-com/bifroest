{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bifroest.fullname" . }}
  labels:
    {{- include "bifroest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bifroest.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  {{- if not (or (and .Values.service.ssh.enabled .Values.networkPolicy.sshPeers) (and .Values.service.http.enabled .Values.networkPolicy.httpPeers) .Values.networkPolicy.monitoringPeers) }}
  ingress: []
  {{- else }}
  ingress:
    {{- if and .Values.service.ssh.enabled .Values.networkPolicy.sshPeers }}
    - ports:
        - port: {{ .Values.service.ssh.targetPort }}
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.sshPeers | nindent 8 }}
    {{- end }}
    {{- if and .Values.service.http.enabled .Values.networkPolicy.httpPeers }}
    - ports:
        - port: {{ .Values.service.http.targetPort }}
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.httpPeers | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.monitoringPeers }}
    - ports:
        - port: {{ $.Values.monitoring.port }}
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
  {{- end }}
{{- end }}
