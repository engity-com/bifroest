apiVersion: v1
kind: Service
metadata:
  name: {{ include "bifroest.fullname" . }}-headless
  labels:
    {{- include "bifroest.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "bifroest.selectorLabels" . | nindent 4 }}
{{ range $name := list "ssh" "http" }}
{{- $service := index $.Values.service $name }}
{{- if $service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bifroest.fullname" $ }}-{{ $name }}
  labels:
    {{- include "bifroest.labels" $ | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  sessionAffinity: {{ $service.sessionAffinity }}
  publishNotReadyAddresses: {{ $service.publishNotReadyAddresses }}
  {{- if eq $service.type "LoadBalancer" }}
  {{- with $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: {{ $name }}
      port: {{ $service.port }}
      targetPort: {{ $name }}
      protocol: TCP
  selector:
    {{- include "bifroest.selectorLabels" $ | nindent 4 }}
{{- end }}
{{ end }}
