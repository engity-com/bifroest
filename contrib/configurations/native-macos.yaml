## Native macOS example. Run Bifröst as root so child processes can use the
## selected account's UID, GID, and supplementary groups.
## Replace "alice" with a controlled, existing local account before use.

flows:
  - name: native-macos
    authorization:
      type: local
      ## Uses the macOS sshd PAM policy for passwords and account-management
      ## checks, including after public-key authentication.
      pamService: sshd
      authorizedKeys:
        - "{{.user.homeDir}}/.ssh/authorized_keys"

    environment:
      type: local
      name: "{{.authorization.user.name}}"
      createIfAbsent: false
      updateIfDifferent: false
      targetAccountPolicy:
        allowedNames:
          - alice
        ## Most interactive macOS users belong to the admin group. Remove this
        ## override when the selected account is not an administrator.
        allowAdministrators: true
