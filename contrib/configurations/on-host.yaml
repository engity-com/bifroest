## Host service for an existing local account on Linux, Windows or macOS.
## Local authentication uses the platform default.
flows:
  - name: local
    authorization:
      type: local
    environment:
      type: local
      name: "{{.authorization.user.name}}"
      ## If you only want to allow user with group "ssh" to log in, uncomment the following lines:
      ## Unix only: Windows users have no primary group.
      #loginAllowed: |
      #  {{ or
      #    (.authorization.user.group.name | eq "ssh" )
      #    (.authorization.user.groups     | firstMatching `{{.name | eq "ssh" }}` )
      #  }}
